[project]
name = "m5-chronos2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Amélien Quenet", email = "qamelien@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chronos-forecasting>=2.0",
    "kaggle>=2.2.4",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    # numpy<2 est impose par torch 2.2.2 (Mac Intel) et conserve a l'identique sur
    # la tour : une version de numpy differente entre les deux machines rendrait
    # les resultats non comparables.
    "numpy<2",
    "peft>=0.18.1",
    "polars>=1.44.2",
    # pyarrow 26.0.0 refuse de s'importer avec numpy 1.x ("pyarrow requires NumPy
    # 2.0 or newer"). Le plafond est donc une consequence directe de numpy<2, et
    # il tombera le jour ou le Mac Intel ne sera plus la contrainte. Sans lui,
    # polars.to_pandas() -- la seule frontiere ou le projet passe par pyarrow --
    # echoue a l'import. Constate le 2026-10-12.
    "pyarrow>=25.0.1,<26",
    "scikit-learn>=1.9.1",
    # Seul torch varie entre les deux machines ; tout le reste est pinne a
    # l'identique, condition pour que les resultats des deux cotes restent
    # comparables.
    #
    #   macOS Intel : 2.2.2 est le dernier build publie pour cette plateforme.
    #
    #   Linux (WSL + GTX 1080) : 2.6.0 depuis PyPI, build CUDA 12.4. Pascal
    #   (sm_61) est encore inclus dans les builds CUDA 12.x ; il a ete retire
    #   des builds 12.8+ et n'existe pas dans CUDA 13.x, donc toute version de
    #   torch >= 2.7 publiee en cu128 est hors de portee de cette carte.
    #
    # Pourquoi PyPI et non l'index download.pytorch.org/whl/cu126 : essaye le
    # 2026-10-12, uv lit bien les metadonnees de ce wheel mais n'inscrit aucune
    # de ses dependances nvidia-* dans le lock. Resultat : torch s'installe et
    # echoue a l'import (libcudart.so.12 introuvable). Depuis PyPI, torch et
    # ses dependances CUDA viennent du meme registre et le lock est complet.
    "torch==2.2.2 ; sys_platform == 'darwin'",
    "torch==2.6.0 ; sys_platform == 'linux'",
    # transformers 5 exige torch >= 2.5 : impossible sur le Mac Intel, donc
    # on reste en 4.x des deux cotes plutot que de diverger.
    "transformers>=4.41,<5",
    "xgboost>=3.4.1",
]

[project.scripts]
m5-chronos2 = "m5_chronos2:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]

[tool.uv]
python-preference = "only-managed"
#
# AVERTISSEMENT - ne pas ajouter de cle `environments` ici. Teste le
# 2026-10-12 : restreindre les environnements reduit le lock de 454 Ko a
# 189 Ko et n'a pas resolu le probleme CUDA ; c'est une optimisation sans
# benefice qui masque la resolution reelle.
#
# AVERTISSEMENT - ne pas supprimer uv.lock pour "forcer" une resolution. Le
# lock est la seule trace d'une combinaison de versions qui fonctionne ; le
# jeter remonte silencieusement des paquets dont les contraintes de
# compatibilite ne sont pas toutes exprimees dans leurs metadonnees (c'est
# ainsi que pyarrow 26 est arrive). Utiliser `uv lock --upgrade-package <nom>`
# pour ne bouger qu'un paquet, et committer le lock a chaque changement.
#
